name: Build FisToplama Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: fistoplama-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  android-web:
    name: Android + Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create Flutter platform files
        run: |
          flutter create --project-name fistoplamav2 .

      - name: Patch platform files
        run: |
          if [ -f scripts/patch_platforms.py ]; then
            python3 scripts/patch_platforms.py
          fi

      - name: Download OpenCV.js
        run: |
          python3 scripts/fetch_opencv.py

      - name: Flutter pub get
        run: |
          flutter pub get

      - name: Build Android APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk \
            --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: FisToplama-Pro-Android
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build Web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build web \
            --release \
            --base-href /FisToplamaV2/ \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-web:
    name: Deploy Web
    needs: android-web
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  ios:
    name: iOS Simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create Flutter platform files
        run: |
          flutter create --project-name fistoplamav2 .

      - name: Patch platform files
        run: |
          if [ -f scripts/patch_platforms.py ]; then
            python3 scripts/patch_platforms.py
          fi

      - name: Flutter pub get
        run: |
          flutter pub get

      - name: Build iOS Simulator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build ios \
            --simulator \
            --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Zip iOS Simulator build
        run: |
          cd build/ios/iphonesimulator
          zip -r FisToplama-Pro-iOS-Simulator.zip Runner.app

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: FisToplama-Pro-iOS-Simulator
          path: build/ios/iphonesimulator/FisToplama-Pro-iOS-Simulator.zip
